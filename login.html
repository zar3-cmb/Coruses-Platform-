<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>تسجيل الدخول وإنشاء حساب - منصة الكورسات</title>
	<link rel="stylesheet" href="css/login.css">
	<meta name="theme-color" content="#4b6cb7">
</head>
<body>
	<div class="login-wrapper">
		<div class="login-card">
		<form id="loginForm" novalidate>
			<h1>تسجيل الدخول</h1>
			<p class="sub">سجّل الدخول للمتابعة إلى صفحة الكورسات.</p>
			<div class="field">
				<label for="email">البريد الإلكتروني</label>
				<input id="email" type="email" name="email" placeholder="name@example.com" required>
			</div>

			<div class="field">
				<label for="password">كلمة المرور</label>
				<input id="password" type="password" name="password" placeholder="●●●●●●" autocomplete="current-password" required minlength="8">
			</div>

			<div class="options">
				<label class="remember"><input id="remember" type="checkbox"> تذكرني</label>
				<span class="forgot">استعادة كلمة المرور غير متاحة حاليًا</span>
			</div>

			<div class="error" id="error" aria-live="polite"></div>

			<button type="submit" class="btn">دخول</button>

			<p class="register">ليس لديك حساب؟ <button type="button" class="text-button" id="showSignup">إنشاء حساب</button></p>
		</form>

		<form id="signupForm" novalidate hidden>
			<h1>إنشاء حساب</h1>
			<p class="sub">أدخل بياناتك لإنشاء حساب جديد.</p>

			<div class="field">
				<label for="signupName">الاسم</label>
				<input id="signupName" type="text" autocomplete="name" maxlength="60" required>
			</div>

			<div class="field">
				<label for="signupEmail">البريد الإلكتروني</label>
				<input id="signupEmail" type="email" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="signupPassword">كلمة المرور (8 أحرف على الأقل)</label>
				<input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required>
			</div>

			<div class="field">
				<label for="signupPasswordConfirm">تأكيد كلمة المرور</label>
				<input id="signupPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
			</div>

			<div class="error" id="signupError" aria-live="polite"></div>
			<button type="submit" class="btn">إنشاء الحساب</button>
			<p class="register">لديك حساب؟ <button type="button" class="text-button" id="showLogin">تسجيل الدخول</button></p>
		</form>
		</div>
	</div>

	<script src="js/login.js"></script>
</body>
</html>
